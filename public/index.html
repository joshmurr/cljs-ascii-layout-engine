<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ascii-layout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <h1>Invoice</h1>
    <form action="" method="post" id="invoice-form">
      <div>
        <label for="invoice-number">Invoice Number:</label>
        <input
          type="number"
          name="invoice-number"
          id="invoice-number"
          step="1"
          required
        />
      </div>
      <div>
        <label for="description-0">Description:</label>
        <textarea
          name="description"
          id="description-0"
          rows="8"
          cols="23"
          required
        >
Write description...
          </textarea>
      </div>
      <div>
        <label for="qty-0">Quantity:</label>
        <input type="number" name="qty" id="qty-0" required />
      </div>
      <div>
        <label for="rate-0">Rate:</label>
        <input type="number" name="rate" id="rate-0" step="0.01" required />
      </div>
      <div>
        <input type="submit" value="Invoice!" />
      </div>
    </form>

    <button id="add-line-item">Add line item</button>

    <form action="" method="post" id="dividends-form"></form>

    <a href="/board-minutes.html">Board minutes</a>
    <a href="/dividend-voucher.html">Dividend voucher</a>

    <pre id="screen"></pre>
    <script src="/js/shared.js"></script>
    <script src="/js/main.js"></script>
  </body>
</html>
